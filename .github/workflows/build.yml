
name: Build Java OOP Mastery APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JavaOOPMastery-Android-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir source
          unzip JavaOOPMastery-Android-Source.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JavaOOPMastery-APK
          path: source/**/build/outputs/apk/debug/*.apk
